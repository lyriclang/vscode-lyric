name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Check and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the language client
        run: npm ci --omit=dev

      - name: Check the manifest
        run: node scripts/check-manifest.mjs

      # vsce stops on a missing LICENSE with a prompt no CI can answer; the LICENSE is tracked
      # here, so packaging is the proof that everything vsce needs is in the repository.
      # It does not create the output directory itself.
      - name: Package
        run: |
          mkdir -p dist
          npx --yes @vscode/vsce package --out dist/vscode-lyric.vsix

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: vscode-lyric
          path: dist/*.vsix
          retention-days: 7

  grammar-sync:
    # The TextMate grammar is made by tree-sitter-lyric from its grammar (script/textmate.py), so
    # that the words and the literal forms have one account; this repository carries the file
    # that script writes, and this job keeps the copy from becoming a fork.
    name: Grammar is tree-sitter-lyric's
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout tree-sitter-lyric
        uses: actions/checkout@v7
        with:
          repository: lyriclang/tree-sitter-lyric
          path: tree-sitter-lyric
          sparse-checkout: textmate

      - name: Compare
        run: diff syntaxes/lyric.tmLanguage.json tree-sitter-lyric/textmate/lyric.tmLanguage.json

  snippets:
    # A snippet is Lyric nothing loads until someone types its prefix: each one, filled with its
    # defaults, must pass the toolchain's 'check' — the one of the dev channel, built from main.
    name: Snippets check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The toolchain of the dev channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lyric" && cd "$RUNNER_TEMP/lyric"
          gh release download dev --repo lyriclang/lyric --pattern '*-linux-x64.tar.gz' --pattern SHA256SUMS
          grep -- '-linux-x64.tar.gz' SHA256SUMS | sha256sum -c -
          tar -xzf ./*-linux-x64.tar.gz
          echo "LYRIC=$(find "$RUNNER_TEMP/lyric" -name lyric5 -type f | head -1)" >> "$GITHUB_ENV"

      - name: Check
        run: node scripts/check-snippets.mjs "$LYRIC"
